name: Build Kernel
on:
  push:
    branches: [ lineage-20.0 ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CI: "false"
    steps:
    - uses: actions/checkout@v4

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt install -y curl llvm lld wget git ccache automake flex bison gperf build-essential zip zlib1g-dev g++-multilib libxml2-utils bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev device-tree-compiler kmod python3 dwarves

    - name: Download clang-r383902
      run: |
        # 与官核完全一致的 Clang 版本
        # 官核: Android (6443078 based on r383902) clang version 11.0.1
        # Git commit: b397f81060ce6d701042b782172ed13bee898b79
        # 从 AOSP 官方下载 clang-r383902
        mkdir -p $GITHUB_WORKSPACE/clang-aosp/google_clang
        cd $GITHUB_WORKSPACE/clang-aosp/google_clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902.tar.gz
        mkdir -p clang-r383902 && tar xzf clang-r383902.tar.gz -C clang-r383902
        rm -f clang-r383902.tar.gz
        # 下载 GCC 工具链
        cd $GITHUB_WORKSPACE/clang-aosp
        wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/android-11.0.0_r48.tar.gz -O gcc-aarch64.tar.gz
        mkdir -p google_gcc/aarch64-linux-android-4.9 && tar xzf gcc-aarch64.tar.gz -C google_gcc/aarch64-linux-android-4.9
        rm -f gcc-aarch64.tar.gz
        wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/android-11.0.0_r48.tar.gz -O gcc-arm.tar.gz
        mkdir -p google_gcc/arm-linux-androideabi-4.9 && tar xzf gcc-arm.tar.gz -C google_gcc/arm-linux-androideabi-4.9
        rm -f gcc-arm.tar.gz

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-bomb
        max-size: 1G

    - name: Build kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang-aosp/google_clang/clang-r383902/bin:$GITHUB_WORKSPACE/clang-aosp/google_gcc/aarch64-linux-android-4.9/bin:$GITHUB_WORKSPACE/clang-aosp/google_gcc/arm-linux-androideabi-4.9/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=${{ github.actor }}
        make -j1 LLVM=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- vendor/cezanne_user_defconfig
        make -j$(nproc --all) LLVM=1 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: Check output
      run: |
        if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "BUILD_OK=true" >> $GITHUB_ENV
        else
            echo "Kernel build failed"
            exit 1
        fi

    - name: Upload kernel
      if: env.BUILD_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-${{ env.BUILD_TIME }}
        path: out/arch/arm64/boot/Image.gz
